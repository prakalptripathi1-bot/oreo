<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forever ❤️</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ff9ecb,#ffd6e8,#fff5f8);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    font-family:Poppins,sans-serif;
}

.box{
    background:white;
    padding:40px;
    border-radius:30px;
    width:90%;
    max-width:700px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.box img{
    width:280px;
    height:280px;
    object-fit:cover;
    border-radius:25px;
    border:6px solid #ff5c9a;
    box-shadow:0 10px 30px rgba(255,92,154,.4);
}

h1{
    color:#ff2d75;
    margin-top:25px;
}

p{
    font-size:20px;
    line-height:1.8;
}

.end{
    font-size:32px;
    color:#ff2d75;
    margin-top:30px;
    font-weight:bold;
}

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="hearts"></div>

<div class="box">

<img src="./images/photo5.jpg.jpeg">

<h1>❤️ MY FOREVER FAVORITE ❤️</h1>

<p style="max-width:550px; margin:20px auto; line-height:1.8;"></p>>
Thank you for reading everything.

Thank you for every smile.

Thank you for every memory.

I don't know what our future looks like...

But I know one thing...

I want you in it.

❤️
</p>

<div class="end">
Forever Starts Here ❤️
</div>

<br><br>

<button id="finalBtn">
One Last Thing... ❤️
</button>
<div id="endingScreen"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:55px;
z-index:9999;
text-align:center;
padding:20px;
">

❤️

<br><br>

Will You Be Mine Forever?

<br><br>

❤️

</div>
<script src="js/script.js"></script>

</body>
</html>
